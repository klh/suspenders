name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: smoke (isolated HOME round-trip)
        run: bun test test/
      - name: parse-check every entrypoint
        run: |
          for f in hooks/gate.ts hooks/session-start.ts hooks/session-end.ts \
                   hooks/bin/work.ts hooks/bin/coord.ts hooks/bin/monitor.ts \
                   hooks/bin/fleet-board.ts hooks/bin/advise.ts \
                   hooks/bin/claim.ts hooks/bin/fleet.ts \
                   hooks/bin/progress.ts hooks/bin/quota-window.ts; do
            bun build "$f" --target=bun --outfile=/dev/null
          done
      - name: installer round-trip
        run: |
          ./install.sh --wire
          test -f "$HOME/.claude/hooks/suspenders/bin/fleet-board.ts"
          python3 -c "import json,os;json.load(open(os.environ['HOME']+'/.claude/settings.json'))"
          ./install.sh --wire
          python3 -c "
import json, os, sys
h = json.load(open(os.environ['HOME'] + '/.claude/settings.json')).get('hooks', {})
n = sum(len(v) for v in h.values())
sys.exit(1) if n != 6 else print('wired', n, 'entries, idempotent')"
