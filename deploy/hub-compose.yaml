# deploy/hub-compose.yaml — ONE hub, parameterized (W310). The reusable unit
# of the start-topology: a local user runs several hubs; each hub's compose is
# this file with a different env section. Desktop example (deploy/README.md):
#   HUB_NAME=desktop docker compose -p klh-hub-desktop up -d
# NAS example: the same file on nas.threads.dk with the NAS section.
#
# Laws inherited from sim/compose.yaml (W162):
#   - signing keys + identity data never leave hub volumes (owner law):
#     buckle secrets auto-generate inside the hub-secrets volume at first
#     boot and are never baked into images or committed.
#   - loopback binds preserved in-code; SUSPENDERS_BIND / BUCKLE_BIND decide
#     the exposure per hub (loopback-only on Desktop, LAN on the NAS board).
#   - repos bind-mount READ-ONLY; containers write only into volumes.
#   - no registry pushes: oven/bun base + bind mounts only.
#
# Enterprise layer (-remote overlays, config-over-code): real hub names,
# peers, Entra/OIDC values live in ~/.config/klh/stack.yaml (mode 600, never
# committed — placeholders in deploy/stack.example.yaml). The envs below are
# the materialized knobs those profiles set; W191 OIDC enforcement is base
# code — the profile only flips it.

name: klh-hub-${HUB_NAME:-desktop}

services:
  # Repo sidecars: the hub pulls its code from the git origins at a pinned
  # ref into named volumes — NO host-path bind mounts of dev checkouts.
  # Idempotent: clone when absent, fetch+reset to the ref when present, so a
  # re-`up` redeploys. Override via HUB_*_REPO_URL / HUB_*_REF in the .env.
  buckle-repo:
    image: alpine/git
    container_name: ${HUB_NAME:-desktop}-buckle-repo
    entrypoint: ["sh", "-c"]
    command:
      - if [ -d /srv/repo/.git ]; then git -C /srv/repo fetch --depth 1 origin "$$HUB_BUCKLE_REF" && git -C /srv/repo reset --hard FETCH_HEAD; else git clone --depth 1 --branch "$$HUB_BUCKLE_REF" "$$HUB_BUCKLE_REPO_URL" /srv/repo; fi
    environment:
      HUB_BUCKLE_REF: ${HUB_BUCKLE_REF:-main}
      HUB_BUCKLE_REPO_URL: ${HUB_BUCKLE_REPO_URL:-https://github.com/klh/buckle.git}
    volumes:
      - buckle-repo:/srv/repo

  buckle-hub:
    image: oven/bun:1
    container_name: ${HUB_NAME:-desktop}-buckle-hub
    network_mode: host
    restart: unless-stopped
    working_dir: /src/buckle
    command: bun run src/server.ts
    depends_on:
      buckle-repo:
        condition: service_completed_successfully
    env_file:
      # break-glass root credential (drift-never + secrets law): generated
      # ON THE HUB DEVICE, mode 600, never committed. BUCKLE_ROOT_KEY seeds
      # the bootstrap principal; mint bksk_ keys via /v1/admin/keys and
      # retire the root. Short form for compose-spec compat (older DSM
      # compose rejects the path/required long form); a MISSING file still
      # fails `up` (compose stats it before creating the service).
      - ${HUB_BUCKLE_ENV_FILE:-./buckle.env}
    environment:
      HOME: /state/hub-home
      BUCKLE_PORT: ${HUB_BUCKLE_PORT:-4111}
      BUCKLE_BIND: ${HUB_BUCKLE_BIND:-127.0.0.1}
      BUCKLE_DB: /state/buckle/buckle.db
      BUCKLE_POLICY: /src/buckle/routing-policy.yaml
      BUCKLE_UPSTREAMS: /src/buckle/upstreams.yaml
      BUCKLE_SECRETS_HOME: /state/secrets
      BUCKLE_AUTH: ${HUB_BUCKLE_AUTH:-on}
      HEARTBEAT_FILE: /state/heartbeats/buckle.json
    volumes:
      - buckle-repo:/src/buckle:ro
      - suspenders-repo:/src/suspenders:ro
      - buckle-state:/state/buckle
      - hub-secrets:/state/secrets
      - heartbeats:/state/heartbeats

  # Health sidecars (owner law): the health verdict about a service comes
  # from a process OUTSIDE the served container — the sidecar polls the
  # target over the wire and serves the result; compose health hits the
  # sidecar. A wedged server runtime cannot paint itself healthy.
  buckle-health:
    image: oven/bun:1
    container_name: ${HUB_NAME:-desktop}-buckle-health
    network_mode: host
    restart: unless-stopped
    depends_on:
      buckle-hub:
        condition: service_started
    command: bun /src/suspenders/deploy/healthcheck/probe.ts --target http://127.0.0.1:${HUB_BUCKLE_PORT:-4111}/status --listen ${HUB_BUCKLE_HEALTH_PORT:-4112} --heartbeat /state/heartbeats/buckle.json
    environment:
      HUB_BUCKLE_HEALTH_PORT: ${HUB_BUCKLE_HEALTH_PORT:-4112}
    volumes:
      - suspenders-repo:/src/suspenders:ro
      - heartbeats:/state/heartbeats:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e 'const r = await fetch("http://127.0.0.1:" + (process.env.HUB_BUCKLE_HEALTH_PORT ?? "4112") + "/status"); if (!r.ok) process.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  suspenders-repo:
    image: alpine/git
    container_name: ${HUB_NAME:-desktop}-suspenders-repo
    entrypoint: ["sh", "-c"]
    command:
      - if [ -d /srv/repo/.git ]; then git -C /srv/repo fetch --depth 1 origin "$$HUB_SUSPENDERS_REF" && git -C /srv/repo reset --hard FETCH_HEAD; else git clone --depth 1 --branch "$$HUB_SUSPENDERS_REF" "$$HUB_SUSPENDERS_REPO_URL" /srv/repo; fi
    environment:
      HUB_SUSPENDERS_REF: ${HUB_SUSPENDERS_REF:-main}
      HUB_SUSPENDERS_REPO_URL: ${HUB_SUSPENDERS_REPO_URL:-https://github.com/klh/suspenders.git}
    volumes:
      - suspenders-repo:/srv/repo

  board-hub:
    image: oven/bun:1
    container_name: ${HUB_NAME:-desktop}-board-hub
    network_mode: host
    restart: unless-stopped
    command: bun /src/suspenders/hooks/bin/fleet-board.ts --port ${HUB_BOARD_PORT:-7809}
    environment:
      HOME: /state/hub-home
      # the healthcheck reads the port from the container env — export what
      # the command flag resolved to, or the probe hits the default and
      # the service is forever "unhealthy" (the NAS cutover lesson)
      HUB_BOARD_PORT: ${HUB_BOARD_PORT:-7809}
      SUSPENDERS_BIND: ${HUB_BOARD_BIND:-127.0.0.1}
      SUSPENDERS_ALLOWED_HOSTS: ${HUB_ALLOWED_HOSTS:-suspenders.local}
      # LAN service-discovery feed (recovery map); unset/empty = none
      SUSPENDERS_SERVICES_JSON: ${HUB_SERVICES_JSON:-}
      HEARTBEAT_FILE: /state/heartbeats/board.json
    volumes:
      - suspenders-repo:/src/suspenders:ro
      - hub-state:/state/hub-home
      - heartbeats:/state/heartbeats
    depends_on:
      suspenders-repo:
        condition: service_completed_successfully
      store-health:
        condition: service_healthy

  board-health:
    image: oven/bun:1
    container_name: ${HUB_NAME:-desktop}-board-health
    network_mode: host
    restart: unless-stopped
    depends_on:
      board-hub:
        condition: service_started
    command: bun /src/suspenders/deploy/healthcheck/probe.ts --target http://127.0.0.1:${HUB_BOARD_PORT:-7809}/status --listen ${HUB_BOARD_HEALTH_PORT:-7800} --heartbeat /state/heartbeats/board.json
    environment:
      HUB_BOARD_HEALTH_PORT: ${HUB_BOARD_HEALTH_PORT:-7800}
    volumes:
      - suspenders-repo:/src/suspenders:ro
      - heartbeats:/state/heartbeats:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e 'const r = await fetch("http://127.0.0.1:" + (process.env.HUB_BOARD_HEALTH_PORT ?? "7800") + "/status"); if (!r.ok) process.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  store-hub:
    image: oven/bun:1
    container_name: ${HUB_NAME}-store-hub
    network_mode: host
    restart: unless-stopped
    command: bun /src/suspenders/hooks/bin/store-server.ts --port ${HUB_STORE_PORT:-7796}
    depends_on:
      suspenders-repo:
        condition: service_completed_successfully
    environment:
      HOME: /state/hub-home
      # same healthcheck-port law as board-hub: export the resolved port
      HUB_STORE_PORT: ${HUB_STORE_PORT:-7796}
      HEARTBEAT_FILE: /state/heartbeats/store.json
    volumes:
      - suspenders-repo:/src/suspenders:ro
      - hub-state:/state/hub-home
      - heartbeats:/state/heartbeats

  store-health:
    image: oven/bun:1
    container_name: ${HUB_NAME:-desktop}-store-health
    network_mode: host
    restart: unless-stopped
    depends_on:
      store-hub:
        condition: service_started
    command: bun /src/suspenders/deploy/healthcheck/probe.ts --target http://127.0.0.1:${HUB_STORE_PORT:-7796}/status --listen ${HUB_STORE_HEALTH_PORT:-7794} --heartbeat /state/heartbeats/store.json
    environment:
      HUB_STORE_HEALTH_PORT: ${HUB_STORE_HEALTH_PORT:-7794}
    volumes:
      - suspenders-repo:/src/suspenders:ro
      - heartbeats:/state/heartbeats:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e 'const r = await fetch("http://127.0.0.1:" + (process.env.HUB_STORE_HEALTH_PORT ?? "7794") + "/status"); if (!r.ok) process.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  belt-repo:
    image: alpine/git
    container_name: ${HUB_NAME:-desktop}-belt-repo
    entrypoint: ["sh", "-c"]
    command:
      - if [ -d /srv/repo/.git ]; then git -C /srv/repo fetch --depth 1 origin "$$HUB_BELT_REF" && git -C /srv/repo reset --hard FETCH_HEAD; else git clone --depth 1 --branch "$$HUB_BELT_REF" "$$HUB_BELT_REPO_URL" /srv/repo; fi
    environment:
      HUB_BELT_REF: ${HUB_BELT_REF:-main}
      HUB_BELT_REPO_URL: ${HUB_BELT_REPO_URL:-https://github.com/klh/belt.git}
    volumes:
      - belt-repo:/srv/repo

  belt-hub:
    image: oven/bun:1
    container_name: ${HUB_NAME:-desktop}-belt-hub
    ports:
      - "${HUB_BELT_BIND:-127.0.0.1}:${HUB_BELT_PORT:-7792}:7791"
    restart: unless-stopped
    command: sh -c 'mkdir -p /state/belt-home/.claude/local-llm /state/belt-home/.claude-insights && exec bun /src/belt/bin/dashboard.ts'
    depends_on:
      belt-repo:
        condition: service_completed_successfully
    environment:
      HOME: /state/belt-home
      BELT_PORT: "7791"
      HEARTBEAT_FILE: /state/heartbeats/belt.json
    volumes:
      - belt-repo:/src/belt:ro
      - suspenders-repo:/src/suspenders:ro
      - belt-state:/state/belt-home
      - heartbeats:/state/heartbeats

  belt-health:
    image: oven/bun:1
    container_name: ${HUB_NAME:-desktop}-belt-health
    network_mode: host
    restart: unless-stopped
    depends_on:
      belt-hub:
        condition: service_started
    command: bun /src/suspenders/deploy/healthcheck/probe.ts --target http://127.0.0.1:${HUB_BELT_PORT:-7792}/api/status --listen ${HUB_BELT_HEALTH_PORT:-7790} --heartbeat /state/heartbeats/belt.json
    environment:
      HUB_BELT_HEALTH_PORT: ${HUB_BELT_HEALTH_PORT:-7790}
    volumes:
      - suspenders-repo:/src/suspenders:ro
      - heartbeats:/state/heartbeats:ro
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e 'const r = await fetch("http://127.0.0.1:" + (process.env.HUB_BELT_HEALTH_PORT ?? "7790") + "/status"); if (!r.ok) process.exit(1);'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  buckle-repo:
  suspenders-repo:
  belt-repo:
  heartbeats:
  buckle-state:
  hub-state:
  hub-secrets:
  belt-state:
